# Cross-NAT PoC — OWNER side (chạy trên máy remote sau NAT).
#
# Mục đích: chạy Neko với GStreamer pipeline tách 2 nhánh:
#   - appsink branch — Neko's pion peer connection, dùng cho native
#     viewer truy cập :8080 (giữ nguyên hành vi, không gãy).
#   - udpsink branch — push VP8 RTP DIRECT UDP sang edge VPS public
#     IP:50004 (mediasoup PlainTransport comedia mode lock peer khi
#     nhận packet đầu).
#
# Bring up (chạy script wrapper, render config + up):
#   ./start-owner.sh <edge_public_ip>
#
# Hoặc thủ công:
#   export SFU_PUBLIC_IP=<edge_public_ip>
#   sed "s/__SFU_PUBLIC_IP__/$SFU_PUBLIC_IP/g" \
#       neko-config.cross-nat.yaml > .neko-rendered.yaml
#   docker compose -f docker-compose.owner.yml up -d --build
#
# Tear down:
#   docker compose -f docker-compose.owner.yml down -v

name: poc-neko-sfu-owner

services:
  neko:
    image: m1k1o/neko:firefox
    container_name: poc-owner-neko
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "8080:8080"
      # Neko native pion EPR — chỉ cần cho user của Neko :8080 (không
      # phải share viewer). Có thể bỏ nếu không test native flow.
      - "59000-59100:59000-59100/udp"
    environment:
      DISPLAY: ":99"
      # Verbose log nhánh udpsink để debug khi RTP không đến edge.
      GST_DEBUG: "udpsink:5,rtpvp8pay:4,tee:4,queue:3,vp8enc:3,3"
      NEKO_CONFIG: "/etc/neko/neko.yaml"
    volumes:
      # Mount file đã render sẵn placeholder (do `start-owner.sh`
      # hoặc `sed` thủ công sinh ra). Không dùng entrypoint override
      # nữa vì race condition Xorg + neko trên Linux strict.
      - ./.neko-rendered.yaml:/etc/neko/neko.yaml:ro
