# Cross-NAT PoC — EDGE side (chạy trên VPS SIN, public IP).
#
# Mục đích: verify direct UDP từ owner Neko → edge mediasoup PlainTransport
# qua public internet, không qua rathole/relay TCP. Owner ở mạng dân
# dụng sau NAT, mediasoup comedia mode auto-detect remote source khi
# packet đầu tiên đến.
#
# So với `docker-compose.yml` (same-machine): chỉ chạy 2 service `sfu`
# + `viewer`, neko bỏ — neko sẽ chạy ở phía owner.
#
# Bring up trên VPS:
#   export SFU_PUBLIC_IP=<vps_public_ip>
#   docker compose -f docker-compose.edge.yml up -d --build
#
# Tear down:
#   docker compose -f docker-compose.edge.yml down -v

name: poc-neko-sfu-edge

services:
  sfu:
    build:
      context: .
      dockerfile: Dockerfile.sfu
    container_name: poc-edge-sfu
    restart: unless-stopped
    ports:
      # Signalling: WS + REST. Public for browser viewer.
      - "4443:4443"
      # WebRtcTransport range cho viewer ICE/DTLS/SRTP. Mediasoup sẽ
      # advertise candidate ip = SFU_PUBLIC_IP, port trong dải này.
      # Phải nằm trong dải UDP đã mở firewall sẵn trên VPS (50000-60000).
      # Pick 50100-60000 — đủ rộng cho hàng trăm viewer concurrent,
      # chừa 50000-50099 cho plain RTP/RTCP để hai pool không đụng.
      - "50100-60000:50100-60000/udp"
      # PlainTransport RTP: owner Neko gửi VP8 vào đây, mediasoup
      # comedia auto-detect remote (ip, port) từ packet đầu tiên.
      # 50004/50005 nằm trong dải 50000-60000 đã mở firewall; con số
      # cuối /4 + /5 giữ nguyên convention 5004/5005 quen thuộc.
      - "50004:50004/udp"
      - "50005:50005/udp"
    environment:
      RUST_LOG: "info,mediasoup=info,sfu_main=debug"
      SFU_LISTEN_HOST: "0.0.0.0"
      SFU_LISTEN_PORT: "4443"
      # CRITICAL: must be the VPS public IPv4. mediasoup advertises này
      # trong ICE candidate; nếu sai hoặc 127.0.0.1 thì viewer không
      # connect được transport.
      SFU_PUBLIC_IP: "${SFU_PUBLIC_IP:?SFU_PUBLIC_IP env required}"
      SFU_RTC_PORT_MIN: "50100"
      SFU_RTC_PORT_MAX: "60000"
      SFU_PLAIN_RTP_PORT: "50004"
      SFU_PLAIN_RTCP_PORT: "50005"

  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile
    container_name: poc-edge-viewer
    restart: unless-stopped
    ports:
      # Public — viewer page truy cập từ browser cá nhân (4G hoặc
      # mạng khác). Dùng 8091 vì 8090 đã bị dịch vụ khác trên VPS chiếm.
      - "8091:80"
    depends_on:
      - sfu
