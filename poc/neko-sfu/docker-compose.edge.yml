# Cross-NAT PoC — EDGE side (chạy trên VPS SIN, public IP).
#
# Mục đích: verify direct UDP từ owner Neko → edge mediasoup PlainTransport
# qua public internet, không qua rathole/relay TCP. Owner ở mạng dân
# dụng sau NAT, mediasoup comedia mode auto-detect remote source khi
# packet đầu tiên đến.
#
# So với `docker-compose.yml` (same-machine): chỉ chạy 2 service `sfu`
# + `viewer`, neko bỏ — neko sẽ chạy ở phía owner.
#
# Bring up trên VPS:
#   export SFU_PUBLIC_IP=<vps_public_ip>
#   docker compose -f docker-compose.edge.yml up -d --build
#
# Tear down:
#   docker compose -f docker-compose.edge.yml down -v

name: poc-neko-sfu-edge

services:
  sfu:
    build:
      context: .
      dockerfile: Dockerfile.sfu
    container_name: poc-edge-sfu
    restart: unless-stopped
    # network_mode: host — mediasoup bind trực tiếp lên host network,
    # không qua Docker bridge + iptables NAT. Bắt buộc khi range UDP
    # lớn (50100-60000 = ~9900 ports) overlap với Linux ephemeral
    # port range (32768-60999 default) — bridge mode `ports:` sẽ
    # bind fail random với "address already in use" khi process khác
    # trên host dùng port nào đó trong dải.
    #
    # Trade-off: container thấy host network nguyên si (4443, 50100-60000,
    # 50004, 50005 đều bind trực tiếp host). Không cần `ports:` block.
    network_mode: host
    environment:
      RUST_LOG: "info,mediasoup=info,sfu_main=debug"
      # Phải là 0.0.0.0 để bind trên tất cả interface của host.
      SFU_LISTEN_HOST: "0.0.0.0"
      SFU_LISTEN_PORT: "4443"
      # CRITICAL: must be the VPS public IPv4. mediasoup advertises này
      # trong ICE candidate; nếu sai hoặc 127.0.0.1 thì viewer không
      # connect được transport.
      SFU_PUBLIC_IP: "${SFU_PUBLIC_IP:?SFU_PUBLIC_IP env required}"
      # WebRtcTransport range cho viewer ICE/DTLS/SRTP — nằm trong
      # dải UDP đã mở firewall sẵn (50000-60000). Pick 50500-50510
      # (11 port = 5 viewer concurrent), chừa 50000-50099 cho plain
      # RTP/RTCP.
      #
      # Range hẹp lại từ 50100-50200 vì test thấy port lottery —
      # mediasoup pick random trong dải lớn, một số port provider
      # NAT rewrite source port làm browser drop. Range hẹp + đã
      # verify probe 50500 work giúp deterministic hơn.
      SFU_RTC_PORT_MIN: "50500"
      SFU_RTC_PORT_MAX: "50510"
      # PlainTransport RTP: owner Neko gửi VP8 vào đây, mediasoup
      # comedia auto-detect remote (ip, port) từ packet đầu tiên.
      SFU_PLAIN_RTP_PORT: "50004"
      SFU_PLAIN_RTCP_PORT: "50005"

  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile
    container_name: poc-edge-viewer
    restart: unless-stopped
    ports:
      # Public — viewer page truy cập từ browser cá nhân (4G hoặc
      # mạng khác). Dùng 8091 vì 8090 đã bị dịch vụ khác trên VPS chiếm.
      - "8091:80"
    # Viewer là static page nginx, không cần host network. Không
    # depends_on sfu vì sfu giờ chạy host network — viewer container
    # chỉ là nginx phục vụ HTML+JS, browser của user connect SFU
    # qua public IP trực tiếp, không qua docker DNS.
