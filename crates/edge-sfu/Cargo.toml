[package]
name = "edge-sfu"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
edge-shared = { path = "../edge-shared" }
# Snapshot reporter posts `EdgeCallbackEvent::SessionSnapshot` every
# 30s for self-healing viewer count drift. Pulled in here (rather
# than wiring through a callback closure from edge-control) so the
# reporter task has a clean ownership model — it owns its own
# `Client` clone and runs for the process lifetime.
edge-callback-client = { path = "../edge-callback-client" }
# mediasoup needs Python + Meson + C++ toolchain to build native bindings.
# On Windows dev, build via WSL2 or skip with: cargo check --workspace --exclude edge-sfu
# CI builds on Linux where toolchain is available.
mediasoup.workspace = true
# Re-exported by mediasoup but explicit access for SctpParameters / Protocol.
mediasoup-types = "0.4"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
dashmap.workspace = true
async-trait.workspace = true
anyhow.workspace = true
# NekoInputBridge (C5) opens a Neko v3 admin WebSocket (Bearer auth) to
# forward viewer input events. tokio-tungstenite is the client used
# elsewhere in the codebase (see dun-app `state/websocket.rs`); rustls
# matches the workspace TLS stack so the Neko URL may be ws:// or wss://.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[dev-dependencies]
proptest.workspace = true
