# Edge_Server stack per region — Phase 1 single-VPS layout.
# Deploy 1 instance per region VPS.
#
# Run from `deploy/` directory; compose resolves `${PWD}/../state/`
# tới folder state ngang hàng với deploy/. Layout:
#   ~/dun-tunel/
#   ├── deploy/
#   │   ├── docker-compose.yml   (file này)
#   │   ├── Caddyfile            (rendered từ Caddyfile.tpl)
#   │   └── .env                 (config)
#   └── state/
#       ├── rathole/server.toml  (rendered từ rathole.tpl.toml)
#       ├── queue/                (bandwidth sequence persistence)
#       ├── caddy_data/           (Caddy auto-managed certs)
#       └── caddy_config/

services:
  edge-control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: dun-tunel/edge-control:latest
    container_name: edge-control
    restart: unless-stopped
    network_mode: host
    environment:
      REGION_ID: ${REGION_ID:?REGION_ID required}
      EDGE_BIND_PORT: "9443"
      DUN_API_ENDPOINT: ${DUN_API_ENDPOINT:?DUN_API_ENDPOINT required}
      DUN_API_KEY: ${DUN_API_KEY:?DUN_API_KEY required}
      CADDY_ADMIN_URL: "http://127.0.0.1:2019"
      RATHOLE_CONFIG_PATH: "/state/rathole/server.toml"
      PERSISTENT_QUEUE_DIR: "/state/queue"
      TUNNEL_JWT_SECRET_V1: ${TUNNEL_JWT_SECRET_V1:-}
      TUNNEL_JWT_SECRET_V2: ${TUNNEL_JWT_SECRET_V2:-}
      # Domain + CF token cho edge-control bootstrap wildcard TLS
      # policy qua Caddy admin API (thay site block cũ trong
      # Caddyfile.tpl).
      SHARE_TUNNEL_DOMAIN: ${SHARE_TUNNEL_DOMAIN:?SHARE_TUNNEL_DOMAIN required}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN required}
      # ─── SFU media (Phase 2 direct-UDP) ──────────────────────────
      # Owner Neko udpsink → mediasoup PlainTransport (comedia). Viewer
      # WebRtcTransport ICE/SRTP uses the RTC range. All ports MUST sit
      # inside the UDP range the hosting provider forwards to this VPS
      # (PoC verified provider forwards 50000-60000; coordinate before
      # changing). announced_ip is the edge PUBLIC IPv4 the viewer's
      # browser + owner's udpsink target — NOT the private NAT address.
      SFU_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP:?SFU_ANNOUNCED_IP required (edge public IPv4)}
      SFU_LISTEN_IP: ${SFU_LISTEN_IP:-0.0.0.0}
      # Optional LAN candidate for same-network (hairpin) testing. When the
      # viewer/owner shares the same public IP as this VPS (same LAN), set
      # this to the edge's private IP (e.g. 192.168.20.6) so viewers get an
      # extra host ICE candidate that bypasses the public hairpin. Leave
      # EMPTY/unset in production — public IP only.
      SFU_ANNOUNCED_IP_LAN: ${SFU_ANNOUNCED_IP_LAN:-}
      # Plain RTP/RTCP producer-ingest pool (owner → SFU). 50000-50099.
      SFU_PLAIN_RTP_MIN_PORT: ${SFU_PLAIN_RTP_MIN_PORT:-50000}
      SFU_PLAIN_RTP_MAX_PORT: ${SFU_PLAIN_RTP_MAX_PORT:-50099}
      # Viewer WebRtcTransport pool (SFU → viewers). With the WebRtcServer
      # UDP-mux model, each worker binds ONE port = SFU_RTC_MIN_PORT +
      # worker_index. So the open/forwarded UDP range is
      # `SFU_RTC_MIN_PORT .. SFU_RTC_MIN_PORT + SFU_WORKERS - 1`.
      # SFU_RTC_MAX_PORT is now only a sanity bound (min < max).
      SFU_RTC_MIN_PORT: ${SFU_RTC_MIN_PORT:-50100}
      SFU_RTC_MAX_PORT: ${SFU_RTC_MAX_PORT:-59999}
      # mediasoup worker count = number of UDP mux ports to forward. Keep
      # small so only a few ports need NAT port-forwarding. Defaults to 1
      # (single mux port = SFU_RTC_MIN_PORT). Was previously unset →
      # defaulted to num_cpus, spawning one mux port per core.
      SFU_WORKERS: ${SFU_WORKERS:-1}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # Read-write: bridge rewrite rathole config + persist sequence
      - ../state/rathole:/state/rathole
      - ../state/queue:/state/queue
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    # Stock `caddy:2-alpine` KHÔNG có module cloudflare DNS. Build
    # custom image (Caddyfile.Dockerfile) qua xcaddy kèm
    # `caddy-dns/cloudflare` để DNS-01 challenge hoạt động.
    build:
      context: .
      dockerfile: Caddyfile.Dockerfile
    image: dun-tunel/caddy-cloudflare:latest
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../state/caddy_data:/data
      - ../state/caddy_config:/config

  rathole:
    image: rapiz1/rathole:latest
    container_name: rathole-server
    restart: unless-stopped
    network_mode: host
    command: ["--server", "/state/rathole/server.toml"]
    volumes:
      - ../state/rathole:/state/rathole:ro

  # Stateless EdDSA cookie-auth sidecar. Caddy `forward_auth` calls
  # `127.0.0.1:9444/check` on every viewer subdomain request that
  # isn't a public asset or a dun-api split-route endpoint. The
  # sidecar verifies the `dun_v` cookie against JWKS pulled from
  # dun-api (24h refresh) plus a revocation list polled every 5s.
  # No per-request round-trip to dun-api → keeps the global 10k req/s
  # rate limit free for actual API traffic.
  edge-viewer-gate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.edge-viewer-gate
    image: dun-tunel/edge-viewer-gate:latest
    container_name: edge-viewer-gate
    restart: unless-stopped
    network_mode: host
    environment:
      BIND_ADDR: "127.0.0.1:9444"
      # JWKS URL = dun-api `/api/viewer/jwks` reachable via the host
      # network namespace. In production this typically goes through
      # the public api.<domain> (TLS) so a misconfigured loopback
      # doesn't accidentally fall back to plaintext on the Internet.
      # For dev / staging without a stable domain, point at the
      # dun-api container's loopback port directly.
      JWKS_URL: ${VIEWER_GATE_JWKS_URL:-${DUN_API_ENDPOINT}/viewer/jwks}
      JWKS_REFRESH_SECONDS: ${VIEWER_GATE_JWKS_REFRESH_SECONDS:-86400}
      # Revocation list polling — share the same edge-callback API
      # key so dun-api can recognize the puller. Optional; without
      # it the sidecar still verifies signatures but jti revocation
      # only takes effect after the cookie's natural 10-minute TTL.
      REVOCATION_URL: ${VIEWER_GATE_REVOCATION_URL:-${DUN_API_ENDPOINT}/tunnels/revoked-jtis}
      REVOCATION_API_KEY: ${DUN_API_KEY:-}
      REVOCATION_POLL_SECONDS: ${VIEWER_GATE_REVOCATION_POLL_SECONDS:-5}
      # Strict mode (P0 hardening). When `true`, sidecar rejects all
      # cookies whenever the revocation feed is older than
      # `REVOCATION_MAX_STALENESS_SECONDS`. Trades availability for
      # instant revocation. See deploy/.env.example for details.
      REVOCATION_REQUIRED: ${VIEWER_GATE_REVOCATION_REQUIRED:-false}
      REVOCATION_MAX_STALENESS_SECONDS: ${VIEWER_GATE_REVOCATION_MAX_STALENESS_SECONDS:-30}
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9444/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - edge-control
