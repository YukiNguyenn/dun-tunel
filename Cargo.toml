[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Dun Studio"]

[workspace.dependencies]
# async runtime
tokio = { version = "1.40", features = ["full"] }

# http server / client
axum = { version = "0.7", features = ["macros", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# webrtc / media — latest stable as of 2026
mediasoup = "0.22"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# error handling
anyhow = "1"
thiserror = "1"

# crypto
sha2 = "0.10"
hmac = "0.12"
jsonwebtoken = "9"
rustls = "0.23"
rustls-pemfile = "2"

# data structures
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"

# testing
proptest = "1"
criterion = "0.5"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
